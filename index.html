<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#12141f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Чек-лист">
<title>Читательский чек-лист</title>
<style>
  html, body { margin: 0; padding: 0; background: #12141f; }
  body { -webkit-text-size-adjust: 100%; }
</style>
</head>
<body>
<div id="root">
  <div class="boot">Загружаю ваш прогресс…</div>
</div>

<style>
  #root {
    --ink: #12141f;
    --surface: #1a1d2b;
    --surface-2: #222639;
    --line: #2e3348;
    --text: #e7e5df;
    --muted: #8b8fa4;
    --gold: #c8a96a;
    --teal: #6fa8a0;
    --plum: #a68cc4;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    background: var(--ink);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    padding: 0 0 64px;
    margin: 0;
    min-height: 100vh;
  }

  #root *, #root *::before, #root *::after { box-sizing: border-box; }

  .boot { padding: 80px 24px; text-align: center; color: var(--muted); }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }

  /* ---------- hero ---------- */
  .hero { padding: 44px 0 28px; }
  .hero h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 30px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  .hero p { margin: 0 0 26px; color: var(--muted); font-size: 14px; max-width: 46ch; }

  .shelf {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    align-items: flex-end;
    padding: 14px 14px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 3px;
  }
  .spine {
    width: 5px;
    height: 26px;
    background: #2c3145;
    border-radius: 1px;
    flex: none;
  }
  .spine.read { background: var(--gold); }
  .spine.current { background: var(--teal); }
  .spine.want { background: var(--plum); }

  .tally {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .tally .big {
    font-family: var(--serif);
    font-size: 34px;
    line-height: 1;
    color: var(--gold);
  }
  .tally .of { color: var(--muted); font-size: 14px; }
  .tally .sep { color: var(--line); }
  .tally .cur { color: var(--teal); font-size: 14px; }
  .tally .wnt { color: var(--plum); font-size: 14px; }

  /* ---------- controls ---------- */
  .controls {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--ink);
    padding: 14px 0 12px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 8px;
  }
  .search {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--text);
    font: inherit;
    padding: 9px 12px;
    margin-bottom: 10px;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus-visible, .chip:focus-visible, .ghost:focus-visible,
  .tick:focus-visible, .flag:focus-visible, summary:focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 2px;
  }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }

  /* ---------- levels & sections ---------- */
  .level { margin-top: 40px; }
  .level-head { border-top: 1px solid var(--line); padding-top: 18px; }
  .level-head h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 22px;
    margin: 0 0 4px;
  }
  .level-head .note { color: var(--muted); font-size: 13.5px; margin: 0; max-width: 52ch; }

  details.sec { border-bottom: 1px solid var(--line); }
  details.sec > summary {
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 2px;
  }
  details.sec > summary::-webkit-details-marker { display: none; }
  .caret { color: var(--muted); font-size: 11px; width: 10px; flex: none; }
  details[open] > summary .caret { transform: rotate(90deg); }
  .sec-name { flex: 1; font-size: 15px; }
  .sec-count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .sec-count.done { color: var(--gold); }

  .items { padding: 2px 0 14px; }

  /* ---------- item ---------- */
  .item { display: flex; gap: 11px; padding: 7px 0; align-items: flex-start; }
  .item.hidden { display: none; }

  .tick {
    flex: none;
    margin-top: 2px;
    width: 17px;
    height: 17px;
    border: 1px solid #3d4358;
    border-radius: 2px;
    background: transparent;
    cursor: pointer;
    padding: 0;
    position: relative;
  }
  .tick[aria-checked="true"] { background: var(--gold); border-color: var(--gold); }
  .tick[aria-checked="true"]::after {
    content: "";
    position: absolute;
    left: 5px; top: 1px;
    width: 4px; height: 9px;
    border: solid var(--ink);
    border-width: 0 2px 2px 0;
    transform: rotate(42deg);
  }

  .body { flex: 1; min-width: 0; }
  .title { font-size: 14.5px; }
  .item.done .title { color: var(--muted); text-decoration: line-through; text-decoration-color: #4a5068; }
  .desc { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .mode {
    display: inline-block;
    font-size: 11.5px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 0 5px;
    margin-left: 6px;
    white-space: nowrap;
    vertical-align: 1px;
  }

  .flag {
    flex: none;
    background: none;
    border: none;
    color: #3d4358;
    cursor: pointer;
    padding: 2px 4px;
    font-size: 14px;
    line-height: 1;
  }
  .flag[data-mark="none"] { color: #3d4358; }
  .flag[data-mark="want"] { color: var(--plum); }
  .flag[data-mark="current"] { color: var(--teal); }

  .empty { color: var(--muted); padding: 30px 0; font-size: 14px; }

  /* ---------- footer ---------- */
  .foot { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 3px;
    cursor: pointer;
  }
  .ghost:hover { color: var(--text); border-color: #454b63; }
  .status { color: var(--muted); font-size: 12.5px; }

  .transfer { margin-top: 16px; }
  .transfer .note { color: var(--muted); font-size: 13px; margin: 0 0 8px; max-width: 52ch; }
  .code {
    width: 100%;
    height: 84px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    padding: 9px 11px;
    resize: vertical;
  }
  .code:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .foot-row { margin-top: 8px; }

  @media (max-width: 520px) {
    .hero h1 { font-size: 25px; }
    .spine { width: 4px; height: 22px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .spine { transition: background 180ms ease; }
    .caret { transition: transform 140ms ease; }
  }
</style>

  const KEY = "reading-tracker-v1";
  const root = document.getElementById("root");
  let state = {};
  let filter = "all";
  let query = "";
  let allItems = [];

  function hid(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return "b" + (h >>> 0).toString(36);
  }

  // Стартовых отметок нет: каждый начинает список с нуля.
  const SEED_STATE = {};

  function applySeed() {
    Object.keys(SEED_STATE).forEach(function (id) {
      if (!state[id]) state[id] = Object.assign({}, SEED_STATE[id]);
    });
  }

  const openSecs = new Set();

  DATA.forEach(function (lv, li) {
    lv.sections.forEach(function (sec, si) {
      sec.key = "s" + li + "_" + si;
      if (lv.open) openSecs.add(sec.key);
      sec.items.forEach(function (it) {
        it.id = hid(it.t);
        allItems.push(it);
      });
    });
  });

  // Хранилище работает в двух средах: внутри просмотрщика артефактов
  // и в обычной вкладке браузера, если файл открыт напрямую.
  const Store = {
    async read(k) {
      if (window.storage && window.storage.get) {
        try {
          const r = await window.storage.get(k);
          if (r && r.value) return r.value;
        } catch (e) { /* ключа ещё нет или хранилище недоступно */ }
      }
      try { return window.localStorage.getItem(k); } catch (e) { return null; }
    },
    async write(k, v) {
      let ok = false;
      if (window.storage && window.storage.set) {
        try { await window.storage.set(k, v); ok = true; } catch (e) { /* пробуем дальше */ }
      }
      try { window.localStorage.setItem(k, v); ok = true; } catch (e) { /* приватный режим */ }
      return ok;
    }
  };

  async function load() {
    try {
      const raw = await Store.read(KEY);
      if (raw) state = JSON.parse(raw);
    } catch (e) {
      state = {};
    }
  }

  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async function () {
      const ok = await Store.write(KEY, JSON.stringify(state));
      setStatus(ok ? "Сохранено" : "Сохранить не вышло. Скопируйте код прогресса внизу страницы.");
    }, 250);
  }

  function setStatus(text) {
    const el = document.getElementById("status");
    if (el) el.textContent = text;
  }

  function st(id) { return state[id] || {}; }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function render() {
    const total = allItems.length;
    const read = allItems.filter(function (i) { return st(i.id).read; }).length;
    const cur = allItems.filter(function (i) { return st(i.id).current && !st(i.id).read; }).length;
    const want = allItems.filter(function (i) { return st(i.id).want && !st(i.id).read; }).length;

    let html = '<div class="wrap">';

    html += '<div class="hero">';
    html += "<h1>Читательский чек-лист</h1>";
    html += "<p>Культурный минимум и расширенный список. Отметки сохраняются, можно возвращаться в любой момент.</p>";
    html += '<div class="shelf">';
    allItems.forEach(function (it) {
      const s = st(it.id);
      const cls = s.read ? "spine read" : (s.current ? "spine current" : (s.want ? "spine want" : "spine"));
      html += '<span class="' + cls + '" title="' + esc(it.t) + '"></span>';
    });
    html += "</div>";
    html += '<div class="tally"><span class="big">' + read + "</span>";
    html += '<span class="of">из ' + total + " прочитано</span>";
    if (cur) html += '<span class="sep">/</span><span class="cur">' + cur + " в процессе</span>";
    if (want) html += '<span class="sep">/</span><span class="wnt">' + want + " в планах</span>";
    html += "</div></div>";

    html += '<div class="controls">';
    html += '<input class="search" id="q" type="search" placeholder="Поиск по автору или названию" value="' + esc(query) + '">';
    html += '<div class="chips">';
    [["all", "Все"], ["todo", "Не прочитано"], ["want", "Хочу прочитать"], ["current", "Читаю сейчас"], ["done", "Прочитано"]].forEach(function (f) {
      html += '<button class="chip" data-filter="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] + "</button>";
    });
    html += "</div></div>";

    let shownTotal = 0;

    DATA.forEach(function (lv, li) {
      let levelHtml = "";
      let levelShown = 0;

      lv.sections.forEach(function (sec, si) {
        const visible = sec.items.filter(matches);
        if (!visible.length) return;
        levelShown += visible.length;

        const done = sec.items.filter(function (i) { return st(i.id).read; }).length;
        const open = openSecs.has(sec.key) || query || filter !== "all";

        levelHtml += '<details class="sec" data-sec="' + sec.key + '"' + (open ? " open" : "") + ">";
        levelHtml += '<summary><span class="caret">▶</span><span class="sec-name">' + esc(sec.name) + "</span>";
        levelHtml += '<span class="sec-count' + (done === sec.items.length ? " done" : "") + '">' + done + "/" + sec.items.length + "</span></summary>";
        levelHtml += '<div class="items">';

        visible.forEach(function (it) {
          const s = st(it.id);
          levelHtml += '<div class="item' + (s.read ? " done" : "") + '">';
          levelHtml += '<button class="tick" role="checkbox" aria-checked="' + !!s.read + '" aria-label="Прочитано: ' + esc(it.t) + '" data-toggle="' + it.id + '"></button>';
          levelHtml += '<div class="body"><div class="title">' + esc(it.t);
          if (it.m) levelHtml += '<span class="mode">' + esc(it.m) + "</span>";
          levelHtml += "</div>";
          if (it.d) levelHtml += '<div class="desc">' + esc(it.d) + "</div>";
          levelHtml += "</div>";
          const mark = s.current ? "current" : (s.want ? "want" : "none");
          const markLabel = { none: "Отложить или начать", want: "Хочу прочитать", current: "Читаю сейчас" }[mark];
          const markGlyph = { none: "＋", want: "★", current: "◆" }[mark];
          levelHtml += '<button class="flag" data-mark="' + mark + '" title="' + markLabel + '" aria-label="' + markLabel + ": " + esc(it.t) + '" data-flag="' + it.id + '">' + markGlyph + "</button>";
          levelHtml += "</div>";
        });

        levelHtml += "</div></details>";
      });

      if (!levelShown) return;
      shownTotal += levelShown;

      html += '<div class="level"><div class="level-head">';
      html += "<h2>" + esc(lv.level) + ". " + esc(lv.title) + "</h2>";
      html += '<p class="note">' + esc(lv.note) + "</p></div>";
      html += levelHtml + "</div>";
    });

    if (!shownTotal) {
      html += '<p class="empty">Ничего не нашлось. Попробуйте другой запрос или снимите фильтр.</p>';
    }

    html += '<div class="foot">';
    html += '<button class="ghost" id="copy">Скопировать прочитанное</button>';
    html += '<button class="ghost" id="backup">Перенести на другое устройство</button>';
    html += '<button class="ghost" id="reset">Сбросить все отметки</button>';
    html += '<span class="status" id="status"></span>';
    html += "</div>";

    html += '<div class="transfer" id="transfer" hidden>';
    html += '<p class="note">Скопируйте этот код и вставьте его в то же поле на другом устройстве, затем нажмите «Загрузить».</p>';
    html += '<textarea class="code" id="code" spellcheck="false"></textarea>';
    html += '<div class="foot-row"><button class="ghost" id="apply">Загрузить прогресс из кода</button></div>';
    html += "</div>";

    html += "</div>";

    const scroll = window.scrollY;
    root.innerHTML = html;
    window.scrollTo(0, scroll);
    bind();
  }

  function matches(it) {
    const s = st(it.id);
    if (filter === "done" && !s.read) return false;
    if (filter === "todo" && s.read) return false;
    if (filter === "current" && !(s.current && !s.read)) return false;
    if (filter === "want" && !(s.want && !s.read)) return false;
    if (query) {
      const hay = (it.t + " " + (it.d || "")).toLowerCase();
      if (hay.indexOf(query.toLowerCase()) === -1) return false;
    }
    return true;
  }

  function bind() {
    root.querySelectorAll("details[data-sec]").forEach(function (d) {
      d.addEventListener("toggle", function () {
        const key = d.getAttribute("data-sec");
        if (d.open) openSecs.add(key); else openSecs.delete(key);
      });
    });

    root.querySelectorAll("[data-toggle]").forEach(function (b) {
      b.addEventListener("click", function () {
        const id = b.getAttribute("data-toggle");
        const s = state[id] || (state[id] = {});
        s.read = !s.read;
        if (s.read) { s.current = false; s.want = false; }
        save();
        render();
      });
    });

    root.querySelectorAll("[data-flag]").forEach(function (b) {
      b.addEventListener("click", function () {
        const id = b.getAttribute("data-flag");
        const s = state[id] || (state[id] = {});
        if (s.current) { s.current = false; s.want = false; }
        else if (s.want) { s.want = false; s.current = true; }
        else { s.want = true; }
        if (s.want || s.current) s.read = false;
        save();
        render();
      });
    });

    root.querySelectorAll("[data-filter]").forEach(function (b) {
      b.addEventListener("click", function () {
        filter = b.getAttribute("data-filter");
        render();
      });
    });

    const q = document.getElementById("q");
    if (q) {
      q.addEventListener("input", function () {
        const pos = q.selectionStart;
        query = q.value;
        render();
        const nq = document.getElementById("q");
        nq.focus();
        nq.setSelectionRange(pos, pos);
      });
    }

    const copy = document.getElementById("copy");
    if (copy) {
      copy.addEventListener("click", function () {
        const lines = allItems.filter(function (i) { return st(i.id).read; }).map(function (i) { return "— " + i.t; });
        const text = lines.length ? lines.join("\n") : "Пока ничего не отмечено.";
        navigator.clipboard.writeText(text).then(
          function () { setStatus("Список скопирован"); },
          function () { setStatus("Скопировать не получилось"); }
        );
      });
    }

    const backup = document.getElementById("backup");
    if (backup) {
      backup.addEventListener("click", function () {
        const box = document.getElementById("transfer");
        const code = document.getElementById("code");
        box.hidden = !box.hidden;
        if (!box.hidden) {
          code.value = JSON.stringify(state);
          code.focus();
          code.select();
          setStatus("Код готов к копированию");
        }
      });
    }

    const apply = document.getElementById("apply");
    if (apply) {
      apply.addEventListener("click", function () {
        const code = document.getElementById("code");
        try {
          const parsed = JSON.parse(code.value.trim());
          if (!parsed || typeof parsed !== "object") throw new Error("bad");
          state = parsed;
          save();
          render();
          setStatus("Прогресс загружен");
        } catch (e) {
          setStatus("Код не распознан. Вставьте его целиком, без пробелов по краям.");
        }
      });
    }

    const reset = document.getElementById("reset");
    if (reset) {
      reset.addEventListener("click", function () {
        if (reset.dataset.armed) {
          state = {};
          save();
          render();
          setStatus("Отметки сброшены");
        } else {
          reset.dataset.armed = "1";
          reset.textContent = "Точно сбросить?";
          setTimeout(function () {
            if (document.body.contains(reset)) {
              delete reset.dataset.armed;
              reset.textContent = "Сбросить все отметки";
            }
          }, 4000);
        }
      });
    }
  }

  load().then(function () {
    applySeed();
    save();
    render();
  });
})();
</script>

</body>
</html>
